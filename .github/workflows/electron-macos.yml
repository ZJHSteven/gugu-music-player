name: Build Electron macOS QA

on:
  workflow_dispatch:
  # Fork 的 feature branch 还没合进默认分支时，workflow_dispatch 不一定可直接发现该工作流。
  # 因此 QA 阶段在这个专用分支 push 时自动构建；正式 PR 前可以再去掉这一条。
  push:
    branches:
      - feat/electron-macos-launcher

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    # GitHub 已在 2026-11-02 退役 macos-14。
    # 现在 Intel 和 Apple Silicon 使用不同的标准 runner 标签。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    env:
      # 首轮 QA 没有 Apple Developer ID，明确关闭证书自动发现。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing server self-test
        # B 站会针对部分海外云机返回风控 HTML；这不应阻塞桌面打包。
        # 本地完整测试仍会覆盖 B 站，这里只跳过依赖外部网站的两项。
        run: SKIP_BILIBILI=1 npm run selftest

      - name: Download matching cloudflared
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build /tmp/gugu-cloudflared
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            url="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz"
          else
            url="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz"
          fi
          curl --fail --location --retry 3 "$url" -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp/gugu-cloudflared
          cp /tmp/gugu-cloudflared/cloudflared build/cloudflared
          chmod +x build/cloudflared
          file build/cloudflared

      - name: Build DMG and ZIP
        shell: bash
        # electron-builder 在 CI 中默认会尝试自动发布；这里只需要构建 artifact。
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name '*.app' -maxdepth 3 | head -n 1)"
          test -n "$app_path"
          test -f "$app_path/Contents/Resources/cloudflared"
          test -f "$app_path/Contents/Resources/app/server/index.js"
          test -f "$app_path/Contents/Resources/app/public/manifest.json"
          file "$app_path/Contents/Resources/cloudflared"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Smoke test packaged Electron runtime when architecture matches runner
        shell: bash
        run: |
          set -euo pipefail
          runner_arch="$(uname -m)"
          want="${{ matrix.arch }}"
          if [[ "$runner_arch" == "x86_64" && "$want" == "x64" ]] || +             [[ "$runner_arch" == "arm64" && "$want" == "arm64" ]]; then
            exe="$(find "$APP_PATH/Contents/MacOS" -type f -maxdepth 1 | head -n 1)"
            "$exe" --smoke-test
          else
            echo "Runner=$runner_arch, package=$want；跳过不可本机执行的架构。"
          fi

      - name: Upload QA packages
        uses: actions/upload-artifact@v4
        with:
          name: gugu-music-player-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
